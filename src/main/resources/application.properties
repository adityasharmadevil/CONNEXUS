spring.application.name=${APP_NAME:videocall}

# Supabase / PostgreSQL
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.show-sql=${JPA_SHOW_SQL:false}

# JWT (custom property, read it with @Value("${app.jwt.secret}"))
app.jwt.secret=${JWT_SECRET_KEY}

# Logging
logging.level.org.springframework.security=${LOGGING_LEVEL_SECURITY:INFO}

# Upstash Redis (only if you use Spring Data Redis, see note below)
spring.data.redis.host=leading-haddock-95688.upstash.io
spring.data.redis.port=6379
spring.data.redis.password=${UPSTASH_REDIS_REST_TOKEN}
spring.data.redis.ssl.enabled=true